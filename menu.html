<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Landing page for Coffee House">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Coffee House</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="menu.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <header>
            <div class="header-container">
                <a href="index.html" class="header-icon">
                    <img class="logo-coffee logo-light" src="assets/main-logo.svg" alt="Coffee House logo" />
                    <img class="logo-coffee logo-dark" src="assets/main-logo-dark.svg" alt="Coffee House logo" />
                </a>

                <nav class="nav-menu" id="nav-menu">
                    <ul class="nav-list">
                        <li><a href="index.html#favorite-coffee" class="nav-link">Favorite coffee</a></li>
                        <li><a href="index.html#about" class="nav-link">About</a></li>
                        <li><a href="index.html#mobile-app" class="nav-link">Mobile app</a></li>
                        <li><a href="#contacts" class="nav-link">Contact us</a></li>
                    </ul>

                    <div class="coffee-menu">
                        <a href="menu.html" id="nav-menu-link" class="active">
                            <span>Menu</span>
                            <img class="coffee-cup" src="assets/coffee-cup.svg" alt="coffee-cup-icon" />
                        </a>
                    </div>
                </nav>

                <div class="header-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Switch theme">
                        <svg class="theme-icon theme-icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
                        </svg>
                        <svg class="theme-icon theme-icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>

                    <button class="burger" id="burger" aria-label="Open menu">
                        <span class="burger-line bar"></span>
                        <span class="burger-line bar"></span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <section class="menu-container">
                <div class="menu-offer">
                    <h1 class="heading-2">Behind each of our cups hides an <span class="accent">amazing surprise</span>
                    </h1>
                    <div class="menu-tabs">
                        <div class="tab-item active" data-filter="coffee">
                            <img src="assets/coffe-icon.png" alt="coffee-icon">
                            <p>Coffee</p>
                        </div>
                        <div class="tab-item" data-filter="tea">
                            <img src="assets/tea-icon.png" alt="tea-cup-icon">
                            <p>Tea</p>
                        </div>
                        <div class="tab-item" data-filter="dessert">
                            <img src="assets/deset-icon.png" alt="dessert-icon">
                            <p>Dessert</p>
                        </div>
                    </div>
                </div>
                <div class="menu-grid"></div>
                <button class="button-refresh" id="load-more" aria-label="Load more cards">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M21.5 2V6H17.5M2.5 22V18H6.5M21 11.5C20.5 7 16.5 3.5 12 3.5C7.5 3.5 3.7 6.6 3 11M21 13C20.3 17.4 16.5 20.5 12 20.5C7.5 20.5 3.5 17 3 12.5"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <div id="myModal" class="modal">
                    <div class="modal-content"></div>
                </div>
            </section>
        </main>
        <footer>
            <div class="contacts" id="contacts">
                <div class="contacts-offer">
                    <h2 class="heading-2">
                        Sip, Savor, Smile. <br>
                        <span class="accent">It’s coffee time!</span>
                    </h2>
                    <div class="socials-footer">
                        <a href="https://twitter.com" target="_blank" rel="noopener noreferrer"
                            class="button-icon-light" aria-label="Twitter">
                            <img src="assets/twitter.svg" alt="twitter icon">
                        </a>
                        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"
                            class="button-icon-light" aria-label="Instagram">
                            <img src="assets/instagram.svg" alt="instagram icon">
                        </a>
                        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer"
                            class="button-icon-light" aria-label="Facebook">
                            <img src="assets/facebook.svg" alt="facebook icon">
                        </a>
                    </div>
                </div>
                <div class="contacts-info">
                    <h3 class="heading-3">Contact us</h3>
                    <div class="contacts-info-container">
                        <a href="https://maps.google.com/?q=8558+Green+Rd+LA" target="_blank" rel="noopener noreferrer">
                            <img src="assets/pin-alt.svg" alt="pin-alt">
                            <p>8558 Green Rd., LA</p>
                        </a>
                        <a href="tel:+16035550123">
                            <img src="assets/phone.svg" alt="phone icon">
                            <p>+1 (603) 555-0123</p>
                        </a>
                        <div class="contact-item">
                            <img src="assets/clock.svg" alt="clock icon">
                            <p>Mon-Sat: 9:00 AM – 23:00 PM</p>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
